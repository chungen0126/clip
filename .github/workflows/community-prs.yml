# Every two hours, list community members' PRs across the tracked projects and publish them to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
#   https://opensource4you.github.io/clip/             open PRs
#   https://opensource4you.github.io/clip/merged.html  merged in the last 30 days
#   https://opensource4you.github.io/clip/reviews.html other people's PRs they reviewed in the last 30 days

name: community-prs

on:
  schedule:
    - cron: "0 */2 * * *"     # UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - github/community_prs.py
      - github/people_all.json
      - .github/workflows/community-prs.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: community-prs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh is preinstalled on the runner; it only needs this
    defaults:
      run:
        working-directory: github
    steps:
      - uses: actions/checkout@v7

      - name: Build pages
        run: |
          mkdir -p site
          SINCE="$(date -u -d '30 days ago' +%F)"
          NAV=(--nav "open=index.html" --nav "merged 30d=merged.html" --nav "reviews 30d=reviews.html")
          python3 community_prs.py --people-file people_all.json --no-cache "${NAV[@]}" \
            --out site/index.html
          python3 community_prs.py --people-file people_all.json --no-cache "${NAV[@]}" \
            --state merged --since "$SINCE" \
            --out site/merged.html
          python3 community_prs.py --people-file people_all.json --no-cache "${NAV[@]}" \
            --role reviewer --state any --since "$SINCE" \
            --out site/reviews.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: github/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5